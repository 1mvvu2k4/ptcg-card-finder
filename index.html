<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#061226">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/app-icon-192.png">
  <meta name="theme-color" content="#030915">
  <title>PTCG 卡片查詢器</title>
  <style>
    [hidden] { display: none !important; }

    :root {
      --ink: #eef7ff;
      --muted: #91a8c7;
      --line: rgba(104, 190, 255, .2);
      --surface: rgba(8, 20, 40, .86);
      --surface-solid: #09172d;
      --wash: #020711;
      --navy: #07152b;
      --blue: #42ddff;
      --blue-dark: #8bedff;
      --violet: #8b68ff;
      --yellow: #bca7ff;
      --shadow: 0 18px 55px rgba(0, 0, 0, .42), 0 0 32px rgba(66, 221, 255, .1);
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(circle at 10% -5%, rgba(66, 221, 255, .15), transparent 32rem),
        radial-gradient(circle at 92% 8%, rgba(139, 104, 255, .14), transparent 34rem),
        linear-gradient(rgba(75, 142, 208, .045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(75, 142, 208, .045) 1px, transparent 1px),
        var(--wash);
      background-size: auto, auto, 32px 32px, 32px 32px, auto;
      color: var(--ink);
      font-family: "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.55;
    }

    ::selection { background: rgba(66, 221, 255, .28); color: white; }

    * { scrollbar-color: rgba(93, 206, 239, .48) rgba(3, 11, 25, .7); scrollbar-width: thin; }

    button, input, select { font: inherit; }

    button, select, summary, input[type="checkbox"] { cursor: pointer; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid rgba(66, 221, 255, .22);
      background: rgba(3, 9, 21, .82);
      box-shadow: 0 10px 35px rgba(0, 0, 0, .28);
      backdrop-filter: blur(18px) saturate(140%);
    }

    .topbar-inner, main, .footer-inner {
      width: min(1440px, calc(100% - 32px));
      margin-inline: auto;
    }

    .topbar-inner {
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      border: 1px solid rgba(143, 239, 255, .84);
      border-radius: 11px;
      background:
        linear-gradient(135deg, rgba(66, 221, 255, .95), rgba(139, 104, 255, .95));
      box-shadow: 0 0 22px rgba(66, 221, 255, .38), inset 0 0 0 7px #07152b;
      transform: rotate(45deg) scale(.78);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.2rem, 2vw, 1.55rem);
      background: linear-gradient(90deg, #f7fbff, #92efff 58%, #c3b5ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: .04em;
    }

    .dataset-note {
      color: var(--muted);
      font-size: .82rem;
      letter-spacing: .03em;
      white-space: nowrap;
    }

    .data-status { display: grid; justify-items: end; gap: 5px; }
    .load-progress { width: min(210px, 38vw); height: 3px; overflow: hidden; border-radius: 999px; background: rgba(111, 167, 220, .18); }
    .load-progress span { display: block; width: 42%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--blue), var(--violet)); animation: loading-slide 1.05s ease-in-out infinite alternate; }
    .load-progress[hidden] { display: none; }
    .retry-load { border: 0; background: transparent; color: var(--blue-dark); padding: 0; font-size: .8rem; text-decoration: underline; }
    @keyframes loading-slide { from { transform: translateX(-20%); } to { transform: translateX(160%); } }

    main { padding: 26px 0 44px; }

    .search-panel {
      position: relative;
      overflow: visible;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(10, 26, 50, .94), rgba(6, 16, 34, .88));
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .035);
    }

    .search-row {
      display: grid;
      grid-template-columns: minmax(250px, 1.5fr) repeat(6, minmax(125px, .62fr)) auto;
      gap: 10px;
      align-items: end;
    }

    .filter-fields { display: contents; }
    .filter-toggle, .filter-backdrop, .filter-sheet-head { display: none; }

    .field { min-width: 0; }

    .field label {
      display: block;
      margin: 0 0 6px 2px;
      color: var(--muted);
      font-size: .875rem;
      font-weight: 700;
      letter-spacing: .05em;
    }

    .control {
      width: 100%;
      min-height: 46px;
      border: 1px solid rgba(111, 167, 220, .28);
      border-radius: 10px;
      background: rgba(2, 10, 23, .74);
      color: var(--ink);
      outline: none;
      padding: 10px 12px;
      transition: border-color .18s ease, box-shadow .18s ease;
    }

    .control:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(66, 221, 255, .13), 0 0 18px rgba(66, 221, 255, .12);
    }

    .control::placeholder, .option-search::placeholder { color: #607897; }

    .multi-select {
      position: relative;
      min-width: 0;
    }

    .multi-select summary {
      position: relative;
      min-height: 46px;
      display: flex;
      align-items: center;
      padding: 10px 38px 10px 12px;
      overflow: hidden;
      border: 1px solid rgba(111, 167, 220, .28);
      border-radius: 10px;
      background: rgba(2, 10, 23, .74);
      color: var(--ink);
      list-style: none;
      outline: none;
      white-space: nowrap;
    }

    .multi-select summary::-webkit-details-marker { display: none; }

    .multi-select summary::after {
      content: '';
      position: absolute;
      right: 14px;
      top: 50%;
      width: 7px;
      height: 7px;
      border-right: 2px solid var(--blue);
      border-bottom: 2px solid var(--blue);
      transform: translateY(-65%) rotate(45deg);
      transition: transform .18s ease;
    }

    .multi-select[open] summary {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(66, 221, 255, .13), 0 0 18px rgba(66, 221, 255, .1);
    }

    .multi-select[open] summary::after { transform: translateY(-30%) rotate(225deg); }

    .multi-value {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .multi-value.has-selection { color: var(--blue-dark); font-weight: 750; }

    .multi-menu {
      position: absolute;
      z-index: 30;
      top: calc(100% + 7px);
      left: 0;
      width: max(100%, 210px);
      max-height: 330px;
      overflow: hidden;
      border: 1px solid rgba(66, 221, 255, .3);
      border-radius: 12px;
      background: #07152b;
      box-shadow: 0 22px 55px rgba(0, 0, 0, .55), 0 0 28px rgba(66, 221, 255, .1);
    }

    .multi-actions {
      display: flex;
      gap: 8px;
      padding: 9px;
      border-bottom: 1px solid var(--line);
      background: rgba(66, 221, 255, .04);
    }

    .multi-actions button {
      min-height: 32px;
      flex: 1;
      border: 1px solid rgba(111, 167, 220, .3);
      border-radius: 8px;
      background: rgba(4, 14, 31, .9);
      color: var(--blue-dark);
      font-size: .875rem;
      font-weight: 750;
    }

    .option-list {
      max-height: 270px;
      overflow-y: auto;
      padding: 6px;
    }

    .option-search {
      width: calc(100% - 18px);
      min-height: 38px;
      margin: 9px 9px 0;
      padding: 7px 10px;
      border: 1px solid rgba(111, 167, 220, .3);
      border-radius: 8px;
      background: rgba(2, 10, 23, .78);
      color: var(--ink);
      outline: none;
    }

    .option-search:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(66, 221, 255, .12);
    }

    .check-option {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 38px;
      padding: 7px 8px;
      border-radius: 8px;
      color: var(--ink);
      font-size: .9rem;
    }

    .check-option:hover { background: rgba(66, 221, 255, .09); }

    .check-option input {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
      margin: 0;
      accent-color: var(--blue);
    }

    .filter-help {
      margin: 12px 2px 0;
      color: var(--muted);
      font-size: .82rem;
    }

    .search-input {
      min-height: 50px;
      padding-left: 16px;
      font-weight: 650;
    }

    .clear-btn, .load-more {
      border: 1px solid rgba(142, 238, 255, .65);
      border-radius: 10px;
      background: linear-gradient(135deg, #14acd0, #7358dd);
      color: #f7fcff;
      font-weight: 750;
      box-shadow: 0 0 20px rgba(66, 221, 255, .13);
      transition: transform .15s ease, filter .15s ease, box-shadow .15s ease;
    }

    .clear-btn {
      min-height: 46px;
      padding: 10px 18px;
      white-space: nowrap;
    }

    .filter-toggle {
      min-height: 44px;
      padding: 9px 13px;
      border: 1px solid rgba(66, 221, 255, .42);
      border-radius: 10px;
      background: rgba(66, 221, 255, .075);
      color: var(--ink);
      font-weight: 750;
    }

    .filter-toggle span {
      display: inline-grid;
      min-width: 23px;
      min-height: 23px;
      margin-left: 6px;
      padding-inline: 6px;
      place-items: center;
      border-radius: 999px;
      background: var(--blue);
      color: #03101f;
      font-size: .75rem;
    }

    .clear-btn:hover, .load-more:hover { filter: brightness(1.13); box-shadow: 0 0 28px rgba(66, 221, 255, .25); }
    .clear-btn:active, .load-more:active { transform: translateY(1px); }

    .summary-row {
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 2px 10px;
    }

    .result-count { margin: 0; font-weight: 800; }
    .result-count span { color: var(--blue-dark); text-shadow: 0 0 14px rgba(66, 221, 255, .35); }
    .hint { margin: 0; color: var(--muted); font-size: .88rem; }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(188px, 1fr));
      gap: 18px;
    }

    .card-tile {
      position: relative;
      display: flex;
      min-width: 0;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(165deg, rgba(11, 28, 53, .94), rgba(5, 14, 30, .96));
      box-shadow: 0 10px 28px rgba(0, 0, 0, .28), inset 0 1px 0 rgba(255, 255, 255, .035);
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }

    .card-tile::after {
      content: '';
      position: absolute;
      inset: 0 0 auto;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--blue), var(--violet), transparent);
      opacity: .48;
      pointer-events: none;
    }

    .card-tile:hover {
      transform: translateY(-6px);
      border-color: rgba(111, 230, 255, .65);
      box-shadow: 0 22px 48px rgba(0, 0, 0, .44), 0 0 28px rgba(66, 221, 255, .16);
    }

    .card-tile:focus-visible {
      outline: 3px solid rgba(66, 221, 255, .5);
      outline-offset: 3px;
    }

    .image-wrap {
      position: relative;
      aspect-ratio: 733 / 1024;
      overflow: hidden;
      padding: 9px 9px 0;
      background:
        radial-gradient(circle at 50% 15%, rgba(66, 221, 255, .13), transparent 44%),
        linear-gradient(145deg, #071426, #0b1d37);
    }

    .image-wrap::before, .detail-image-wrap::before {
      content: '';
      position: absolute;
      z-index: 0;
      inset: 0;
      background: linear-gradient(105deg, transparent 36%, rgba(66, 221, 255, .09) 48%, transparent 60%);
      transform: translateX(-100%);
      animation: image-loading 1.4s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes image-loading { to { transform: translateX(100%); } }

    .card-image {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      border-radius: 8px;
      filter: saturate(.94) contrast(1.03);
      transition: transform .25s ease;
    }

    .card-tile:hover .card-image { transform: scale(1.018); }

    .image-fallback {
      position: absolute;
      z-index: 2;
      inset: 0;
      display: grid;
      place-content: center;
      padding: 18px;
      color: var(--muted);
      text-align: center;
      font-weight: 750;
      background: linear-gradient(145deg, #071426, #0b1d37);
    }

    .image-retry {
      margin-top: 8px;
      padding: 6px 10px;
      border: 1px solid rgba(66, 221, 255, .35);
      border-radius: 8px;
      background: rgba(66, 221, 255, .08);
      color: var(--blue-dark);
    }

    .card-body { padding: 14px 14px 16px; }

    .card-title {
      margin: 0 0 5px;
      overflow: hidden;
      color: var(--ink);
      font-size: 1.03rem;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-number { color: var(--muted); font-size: .82rem; }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 25px;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(66, 221, 255, .22);
      background: rgba(66, 221, 255, .08);
      color: #a4efff;
      font-size: .76rem;
      font-weight: 750;
    }

    .chip.reg { border-color: rgba(188, 167, 255, .3); background: rgba(139, 104, 255, .12); color: #c8baff; }

    .empty-state {
      grid-column: 1 / -1;
      padding: 68px 20px;
      border: 1px dashed rgba(111, 190, 236, .38);
      border-radius: var(--radius);
      background: rgba(7, 21, 43, .72);
      text-align: center;
    }

    .empty-state h2 { margin: 0 0 8px; font-size: 1.2rem; }
    .empty-state p { margin: 0; color: var(--muted); }

    .more-wrap { display: flex; justify-content: center; padding-top: 28px; }
    .load-more { min-width: 190px; padding: 12px 22px; }

    footer {
      border-top: 1px solid var(--line);
      background: rgba(2, 7, 17, .82);
      color: var(--muted);
      font-size: .82rem;
    }

    .footer-inner { padding: 18px 0 22px; }

    dialog {
      width: min(920px, calc(100% - 26px));
      max-height: min(88vh, 900px);
      padding: 0;
      overflow: hidden;
      border: 1px solid rgba(66, 221, 255, .28);
      border-radius: 18px;
      color: var(--ink);
      background: #061226;
      box-shadow: 0 35px 95px rgba(0, 0, 0, .66), 0 0 42px rgba(66, 221, 255, .12);
    }

    dialog::backdrop { background: rgba(0, 4, 12, .82); backdrop-filter: blur(7px); }

    .modal-head {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(6, 18, 38, .96);
    }

    .modal-head h2 {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      min-width: 0;
      margin: 0;
      font-size: 1.25rem;
    }

    .modal-kind {
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--blue-dark);
      font-size: .7rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .modal-name { overflow-wrap: anywhere; }
    .modal-type-icon { width: 30px; height: 30px; flex: 0 0 auto; object-fit: contain; }

    .close-btn {
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(66, 221, 255, .06);
      color: var(--ink);
      font-size: 1.4rem;
      line-height: 1;
    }

    .modal-scroll { max-height: calc(88vh - 69px); overflow: auto; }
    .detail-loading { padding: 26px; color: var(--muted); }

    .modal-grid {
      display: grid;
      grid-template-columns: minmax(250px, 340px) 1fr;
      gap: 24px;
      padding: 22px;
    }

    .detail-image-wrap {
      position: relative;
      aspect-ratio: 733 / 1024;
      overflow: hidden;
      border-radius: 14px;
      border: 1px solid rgba(66, 221, 255, .24);
      background: #08172b;
      box-shadow: 0 18px 42px rgba(0, 0, 0, .42), 0 0 22px rgba(66, 221, 255, .08);
    }

    .detail-image {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #08172b;
    }

    .detail-side { min-width: 0; }

    .set-line { margin: 0 0 14px; color: var(--muted); font-weight: 650; }

    .stat-groups { display: grid; gap: 11px; margin-bottom: 18px; }
    .stat-group { display: grid; gap: 8px; }
    .stat-group + .stat-group { padding-top: 11px; border-top: 1px solid var(--line); }
    .stat-group-two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stat-group-four { grid-template-columns: repeat(4, minmax(0, 1fr)); }

    .stat {
      min-width: 0;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: rgba(66, 221, 255, .045);
    }

    .stat small { display: block; color: var(--muted); font-size: .72rem; }
    .stat strong { display: block; margin-top: 2px; overflow-wrap: anywhere; }

    .detail-section { margin-top: 20px; }
    .detail-section h3 { margin: 0 0 9px; font-size: .92rem; color: var(--blue-dark); letter-spacing: .04em; }
    .detail-section p { margin: 0; }

    .skill-list { display: grid; gap: 9px; }

    .skill {
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-left: 4px solid var(--blue);
      border-radius: 10px;
      background: rgba(7, 23, 45, .78);
    }

    .skill-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .skill-title strong { color: #dff9ff; }
    .damage { flex: 0 0 auto; font-size: 1.06rem; font-weight: 850; }
    .skill-meta { margin: 4px 0 0; color: var(--muted); font-size: .8rem; }
    .skill-effect { margin: 7px 0 0; white-space: pre-wrap; }

    .flavor {
      padding: 13px 15px;
      border-left: 4px solid var(--violet);
      background: rgba(139, 104, 255, .09);
      color: #d8d0f8;
    }

    .link-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }

    .official-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 9px 14px;
      border-radius: 10px;
      border: 1px solid rgba(118, 233, 255, .5);
      background: linear-gradient(135deg, #119dbf, #6650c9);
      color: white;
      text-decoration: none;
      font-weight: 750;
    }

    .official-link.secondary { border: 1px solid var(--line); background: rgba(66, 221, 255, .06); color: var(--blue-dark); }

    .noscript {
      margin: 24px auto;
      width: min(760px, calc(100% - 32px));
      padding: 16px;
      border: 1px solid rgba(188, 167, 255, .5);
      border-radius: 10px;
      background: #17132c;
    }

    /* A 版：極簡科技圖鑑。保留原有配色，改用排版、細線與資訊層級呈現科技感。 */
    body {
      background: linear-gradient(180deg, #020711 0%, #040b18 48%, #020711 100%);
    }

    .topbar {
      border-bottom-color: rgba(104, 190, 255, .18);
      background: rgba(2, 7, 17, .94);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .22);
      backdrop-filter: blur(14px);
    }

    .topbar-inner { min-height: 66px; }

    .brand { gap: 11px; }

    .brand-mark {
      position: relative;
      width: 32px;
      height: 32px;
      border-color: rgba(66, 221, 255, .72);
      border-radius: 8px;
      background: rgba(66, 221, 255, .06);
      box-shadow: none;
      transform: rotate(45deg) scale(.76);
    }

    .brand-mark::after {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(139, 104, 255, .88);
      border-radius: 3px;
      background: rgba(139, 104, 255, .32);
    }

    h1 {
      background: none;
      color: var(--ink);
      font-size: clamp(1.12rem, 2vw, 1.42rem);
      letter-spacing: .025em;
    }

    .dataset-note {
      font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      font-size: .76rem;
      letter-spacing: .015em;
    }

    main { padding-top: 22px; }

    .search-panel {
      overflow: visible;
      padding: 17px;
      border-color: rgba(104, 190, 255, .22);
      border-radius: 14px;
      background: rgba(7, 21, 43, .88);
      box-shadow: 0 12px 30px rgba(0, 0, 0, .18);
    }

    .search-panel::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 18px;
      width: 72px;
      height: 1px;
      background: var(--blue);
    }

    .panel-heading {
      display: flex;
      align-items: flex-end;

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <h1>PTCG 卡片查詢器</h1>
      </div>
      <div class="data-status">
        <div class="dataset-note" id="dataset-note">準備卡片資料中…</div>
        <div class="load-progress" id="load-progress" role="progressbar" aria-label="載入卡片搜尋資料"><span></span></div>

      </div>
    </div>
  </header>

  <main>
    <section class="search-panel" aria-label="卡片搜尋與篩選">

        </div>
        <button class="filter-toggle" id="filter-toggle" type="button" aria-expanded="false" aria-controls="filter-fields">篩選條件 <span id="filter-count">0</span></button>
        <button class="filter-backdrop" id="filter-backdrop" type="button" aria-label="關閉篩選條件" tabindex="-1"></button>
        <div class="filter-fields" id="filter-fields">
          <div class="filter-sheet-head"><strong>篩選條件</strong><button id="filter-close" type="button" aria-label="關閉篩選條件">×</button></div>
        <div class="field">
          <label id="category-label">系列分類</label>

            <summary><span class="multi-value">全部分類</span></summary>
            <div class="multi-menu" role="group" aria-labelledby="category-label">
              <div class="multi-actions"><button type="button" data-action="all">全選</button><button type="button" data-action="clear">清除</button></div>
              <div class="option-list" id="category-options"></div>
            </div>
          </details>
        </div>
        <div class="field">
          <label id="expansion-label">系列</label>
          <details class="multi-select" id="expansion-filter">
            <summary><span class="multi-value">全部系列</span></summary>
            <div class="multi-menu" role="group" aria-labelledby="expansion-label">
              <input class="option-search" id="expansion-option-search" type="search" autocomplete="off" placeholder="搜尋系列名稱或代碼" aria-label="搜尋系列">

            </div>
          </details>
        </div>
        <div class="field">
          <label id="kind-label">卡片種類</label>
          <details class="multi-select" id="kind-filter">
            <summary><span class="multi-value">全部種類</span></summary>
            <div class="multi-menu" role="group" aria-labelledby="kind-label">
              <div class="multi-actions"><button type="button" data-action="all">全選</button><button type="button" data-action="clear">清除</button></div>
              <div class="option-list" id="kind-options"></div>
            </div>
          </details>
        </div>
        <div class="field">
          <label id="type-label">寶可夢屬性</label>
          <details class="multi-select" id="type-filter">
            <summary><span class="multi-value">全部屬性</span></summary>
            <div class="multi-menu" role="group" aria-labelledby="type-label">
              <div class="multi-actions"><button type="button" data-action="all">全選</button><button type="button" data-action="clear">清除</button></div>
              <div class="option-list" id="type-options"></div>
            </div>
          </details>
        </div>
        <div class="field">
          <label id="stage-label">進化階段</label>
          <details class="multi-select" id="stage-filter">
            <summary><span class="multi-value">全部階段</span></summary>
            <div class="multi-menu" role="group" aria-labelledby="stage-label">
              <div class="multi-actions"><button type="button" data-action="all">全選</button><button type="button" data-action="clear">清除</button></div>
              <div class="option-list" id="stage-options"></div>
            </div>
          </details>
        </div>
        <div class="field">
          <label id="regulation-label">規則標記</label>
          <details class="multi-select" id="regulation-filter">
            <summary><span class="multi-value">全部標記</span></summary>
            <div class="multi-menu" role="group" aria-labelledby="regulation-label">
              <div class="multi-actions"><button type="button" data-action="all">全選</button><button type="button" data-action="clear">清除</button></div>
              <div class="option-list" id="regulation-options"></div>
            </div>
          </details>
        </div>
        <button class="clear-btn" id="clear" type="button">清除條件</button>
        </div>
      </div>
      <p class="filter-help">同一類別可複選，符合其中一項即可；不同類別之間會同時套用。</p>
    </section>

    <div class="summary-row" aria-live="polite">
      <p class="result-count" id="result-count">整理卡片中…</p>
      <p class="hint">點選卡片可查看完整資料</p>
    </div>

    <section class="card-grid" id="card-grid" aria-label="卡片搜尋結果"></section>
    <div class="more-wrap"><button class="load-more" id="load-more" type="button" hidden>顯示更多卡片</button></div>
  </main>

    <div class="footer-inner">卡片資料、卡圖與官方頁面需要網路連線。本工具為非官方個人查詢工具，卡片資料與圖像權利屬原權利人。</div>

  </dialog>

"image":"https://asia.pokemon-card.com/tw/card-img/tw00010061.png"},{"id":"10094","name":"妮莫","code":"SVHM","number":"019/022","type":"","subtype":"支援者卡","regulation":"G","image":"https://asia.pokemon-card.com/tw/card-img/tw00010094.png"},{"id":"11328","name":"仆斬將軍","code":"SVI","number":"037/066","type":"惡","subtype":"2階進化","regulation":"H","image":"https://asia.pokemon-card.com/tw/card-img/tw00011328.png"},{"id":"11176","name":"基本【雷】能量","code":"SVK","number":"LIG","type":"","subtype":"基本能量卡","regulation":"J","image":"https://asia.pokemon-card.com/tw/card-img/tw00011176.png"},{"id":"12232","name":"博士的研究","code":"SVM","number":"162/175","type":"","subtype":"支援者卡","regulation":"G","image":"https://asia.pokemon-card.com/tw/card-img/tw00012232.png"},{"id":"12582","name":"\u003c大吾的>念力土偶","code":"SVOD","number":"002/020","type":"超","subtype":"1階進化","regulation":"I","image":"https://asia.pokemon-card.com/tw/card-img/tw00012582.png"},{"id":"12613","name":"能量回收器","code":"SVOM","number":"010/021","type":"","subtype":"物品卡","regulation":"I","image":"https://asia.pokemon-card.com/tw/card-img/tw00012613.png"},{"id":"8114","name":"陸地水母ex","code":"SVP1","number":"002/007","type":"草","subtype":"1階進化","regulation":"G","image":"https://asia.pokemon-card.com/tw/card-img/tw00008114.png"},{"id":"11106","name":"瑪力露麗","code":"SVPN","number":"004/008","type":"超","subtype":"1階進化","regulation":"H","image":"https://asia.pokemon-card.com/tw/card-img/tw00011106.png"},{"id":"11099","name":"炭小侍","code":"SVPS","number":"005/008","type":"火","subtype":"基礎","regulation":"H","image":"https://asia.pokemon-card.com/tw/card-img/tw00011099.png"},{"id":"13173","name":"粉碎之錘","code":"SVQL","number":"013/022","type":"","subtype":"物品卡","regulation":"J","image":"https://asia.pokemon-card.com/tw/card-img/tw00013173.png"},{"id":"13140","name":"自爆磁怪","code":"SVQP","number":"004/023","type":"雷","subtype":"2階進化","regulation":"G","image":"https://asia.pokemon-card.com/tw/card-img/tw00013140.png"},{"id":"10796","name":"光輝甲賀忍蛙","code":"SVTG","number":"002/019","type":"水","subtype":"基礎","regulation":"F","image":"https://asia.pokemon-card.com/tw/card-img/tw00010796.png"},{"id":"10855","name":"基本【鋼】能量","code":"SVTH","number":"MET","type":"","subtype":"基本能量卡","regulation":"J","image":"https://asia.pokemon-card.com/tw/card-img/tw00010855.png"},{"id":"10727","name":"小火龍","code":"SVTL","number":"001/021","type":"火","subtype":"基礎","regulation":"G","image":"https://asia.pokemon-card.com/tw/card-img/tw00010727.png"},{"id":"10760","name":"高級球","code":"SVTM","number":"012/022","type":"","subtype":"物品卡","regulation":"I","image":"https://asia.pokemon-card.com/tw/card-img/tw00010760.png"},{"id":"10833","name":"老大的指令","code":"SVTR","number":"019/021","type":"","subtype":"支援者卡","regulation":"I","image":"https://asia.pokemon-card.com/tw/card-img/tw00010833.png"},{"id":"10777","name":"謎擬Q","code":"SVTS","number":"006/022","type":"超","subtype":"基礎","regulation":"G","image":"https://asia.pokemon-card.com/tw/card-img/tw00010777.png"}].slice();
      const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
      for (let index = 0; index < Math.min(10, pool.length); index += 1) {
        const picked = index + Math.floor(Math.random() * (pool.length - index));
        [pool[index], pool[picked]] = [pool[picked], pool[index]];
      }
      const selected = pool.slice(0, 10);
      window.__HOME_CARD_IDS__ = selected.map(card => card.id);
      document.querySelector('main').setAttribute('aria-busy', 'true');
      document.getElementById('filter-toggle').disabled = true;
      document.getElementById('dataset-note').textContent = '14,582 張卡片 · 搜尋資料載入中…';
      document.getElementById('result-count').innerHTML = '首頁隨機展示 <span>10</span> 張卡片';
      document.getElementById('card-grid').innerHTML = selected.map(card => `
        <article class="card-tile" aria-disabled="true">
          <div class="image-wrap">${card.image ? `<img class="card-image" src="${escapeHtml(card.image)}" alt="${escapeHtml(card.name)}" loading="lazy" decoding="async" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><div class="image-fallback" hidden>圖片暫時無法載入<br>${escapeHtml(card.name)}</div>` : `<div class="image-fallback">${escapeHtml(card.name)}</div>`}</div>
          <div class="card-body">
            <h2 class="card-title" title="${escapeHtml(card.name)}">${escapeHtml(card.name)}</h2>
            <div class="card-number">${escapeHtml([card.code, card.number].filter(Boolean).join(' · '))}</div>
            <div class="chips">
              ${card.type ? `<span class="chip">${escapeHtml(card.type)}</span>` : ''}
              ${card.subtype ? `<span class="chip">${escapeHtml(card.subtype)}</span>` : ''}
              ${card.regulation ? `<span class="chip reg">${escapeHtml(card.regulation)}</span>` : ''}
            </div>
          </div>

  </script>
  <script>
    (async () => {
      'use strict';

      const response = await fetch('cards-index.json?v=6541cec68f6d');
      if (!response.ok) throw new Error(`Card data request failed: ${response.status}`);
      const pack = await response.json();
      const fields = pack.fields;
      const fieldIndex = Object.fromEntries(fields.map((field, index) => [field, index]));
      const get = (row, key) => row[fieldIndex[key]] ?? '';
      const seriesByCode = new Map(pack.series.map(series => [series.code, series]));
      const seriesFor = row => seriesByCode.get(get(row, 'expansion_code'));
      const normalize = value => String(value || '').normalize('NFKC').toLocaleLowerCase('zh-Hant').replace(/\s+/g, ' ').trim();
      const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
      const escapeAttr = escapeHtml;
      const HOME_CARD_COUNT = 10;
      const PAGE_SIZE = 60;

      const elements = {
        search: document.getElementById('search'),
        expansionOptionSearch: document.getElementById('expansion-option-search'),
        clear: document.getElementById('clear'),
        grid: document.getElementById('card-grid'),
        count: document.getElementById('result-count'),
        loadMore: document.getElementById('load-more'),
        dialog: document.getElementById('detail-dialog'),
        dialogTitle: document.getElementById('detail-title'),
        dialogContent: document.getElementById('detail-content'),
        closeDialog: document.getElementById('close-dialog'),
        datasetNote: document.getElementById('dataset-note'),
        loadProgress: document.getElementById('load-progress'),
        retryLoad: document.getElementById('retry-load'),
        filterToggle: document.getElementById('filter-toggle'),
        filterCount: document.getElementById('filter-count'),
        filterFields: document.getElementById('filter-fields'),
        filterBackdrop: document.getElementById('filter-backdrop'),
        filterClose: document.getElementById('filter-close'),
      };

      const cards = pack.rows.map((row, position) => ({ row, position, searchText: null }));
      const cardsById = new Map(cards.map(card => [get(card.row, 'card_id'), card]));
      const searchTextFor = card => {
        if (card.searchText !== null) return card.searchText;
        const row = card.row;
        const skills = get(row, 'skills_json');
        const skillText = Array.isArray(skills)
          ? skills.flatMap(skill => [skill.section, skill.name, ...(skill.cost || []), skill.damage, skill.effect]).join(' ')
          : String(skills || '');
        card.searchText = normalize([
          get(row, 'card_name'), get(row, 'collector_number'), get(row, 'expansion_code'),
          get(row, 'expansion_name'), seriesFor(row)?.label, seriesFor(row)?.category,
          get(row, 'illustrator'), get(row, 'card_kind'),
          get(row, 'subtype'), skillText
        ].join(' '));
        return card.searchText;
      };

      const pickRandomCards = (source, count) => {
        const pool = source.slice();
        const limit = Math.min(count, pool.length);
        for (let index = 0; index < limit; index += 1) {
          const picked = index + Math.floor(Math.random() * (pool.length - index));
          [pool[index], pool[picked]] = [pool[picked], pool[index]];
        }
        return pool.slice(0, limit);
      };

      let isHomeRandom = true;
      const initialHomeCards = Array.isArray(window.__HOME_CARD_IDS__)
        ? window.__HOME_CARD_IDS__.map(id => cardsById.get(id)).filter(Boolean).slice(0, HOME_CARD_COUNT)
        : [];
      let filteredCards = initialHomeCards.length === HOME_CARD_COUNT
        ? initialHomeCards
        : pickRandomCards(cards, HOME_CARD_COUNT);
      let visibleCount = HOME_CARD_COUNT;
      let searchTimer = null;

      const formatDate = value => {
        if (!value) return '';
        const parsed = new Date(value);
        if (Number.isNaN(parsed.getTime())) return value.slice(0, 10);
        return new Intl.DateTimeFormat('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit' }).format(parsed);
      };

      const uniqueValues = key => [...new Set(cards.map(card => get(card.row, key)).filter(Boolean))]
        .sort((a, b) => String(a).localeCompare(String(b), 'zh-Hant', { numeric: true }));

      const filters = {
        category: {
          allLabel: '全部分類',
          details: document.getElementById('category-filter'),
          list: document.getElementById('category-options'),
        },
        expansion: {
          field: 'expansion_code',
          allLabel: '全部系列',
          details: document.getElementById('expansion-filter'),
          list: document.getElementById('expansion-options'),
        },
        kind: {
          field: 'card_kind',
          allLabel: '全部種類',
          details: document.getElementById('kind-filter'),
          list: document.getElementById('kind-options'),
        },
        type: {
          field: 'pokemon_type',
          allLabel: '全部屬性',
          details: document.getElementById('type-filter'),
          list: document.getElementById('type-options'),
        },
        stage: {
          field: 'evolution_stage',
          allLabel: '全部階段',
          details: document.getElementById('stage-filter'),
          list: document.getElementById('stage-options'),
        },
        regulation: {
          field: 'regulation_mark',
          allLabel: '全部標記',
          details: document.getElementById('regulation-filter'),
          list: document.getElementById('regulation-options'),
        },
      };

      const seriesEraRank = code => {
        const upper = code.toUpperCase();
        if (upper.startsWith('M')) return 0;
        if (upper.startsWith('SV')) return 1;
        if (upper.startsWith('S')) return 2;
        if (upper.startsWith('AC') || upper.startsWith('AS')) return 3;
        return 4;
      };
      const compareSeriesCodes = (codeA, codeB) => {
        const eraDifference = seriesEraRank(codeA) - seriesEraRank(codeB);
        if (eraDifference) return eraDifference;
        const numberA = Number(codeA.match(/\d+/)?.[0] ?? -1);
        const numberB = Number(codeB.match(/\d+/)?.[0] ?? -1);
        if (numberA !== numberB) return numberB - numberA;
        return codeB.localeCompare(codeA, 'zh-Hant', { numeric: true });
      };
      const expansionOptions = pack.series
        .map(series => ({ value: series.code, label: series.label, category: series.category }))
        .sort((a, b) => compareSeriesCodes(a.value, b.value));

      const fillCheckboxes = (key, filter, options) => {
        const fragment = document.createDocumentFragment();
        options.forEach((option, index) => {
          const value = typeof option === 'string' ? option : option.value;
          const display = typeof option === 'string' ? option : option.label;
          const label = document.createElement('label');
          label.className = 'check-option';
          if (typeof option !== 'string') label.dataset.category = option.category || '';
          const input = document.createElement('input');
          input.type = 'checkbox';
          input.value = value;
          input.dataset.label = display;
          input.id = `filter-${key}-${index}`;
          const text = document.createElement('span');
          text.textContent = display;
          label.append(input, text);
          fragment.appendChild(label);
        });
        filter.list.appendChild(fragment);
      };

      Object.entries(filters).forEach(([key, filter]) => {
        fillCheckboxes(key, filter, key === 'category'
          ? ['擴充包', '預組', '特典卡']
          : key === 'expansion' ? expansionOptions : uniqueValues(filter.field));
      });

      elements.datasetNote.textContent = `${cards.length.toLocaleString('zh-TW')} 張卡片 · 資料更新 ${formatDate(pack.sourceUpdatedAt)}`;
      elements.loadProgress.hidden = true;
      elements.retryLoad.hidden = true;
      elements.filterToggle.disabled = false;
      document.querySelector('main').removeAttribute('aria-busy');

      const imageMarkup = (row, className, altSuffix = '') => {
        const name = get(row, 'card_name') || '卡片';
        const src = get(row, 'image_url');
        if (!src) return `<div class="image-fallback">${escapeHtml(name)}</div>`;
        return `<img class="${className}" src="${escapeAttr(src)}" alt="${escapeAttr(name + altSuffix)}" loading="lazy" decoding="async" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><div class="image-fallback" hidden>圖片暫時無法載入<br>${escapeHtml(name)}<button class="image-retry" type="button" data-src="${escapeAttr(src)}">重新載入圖片</button></div>`;
      };

      const retryImage = button => {
        const wrap = button.closest('.image-wrap, .detail-image-wrap');
        const image = wrap?.querySelector('img');
        const fallback = button.closest('.image-fallback');
        if (!image || !fallback) return;
        const url = new URL(button.dataset.src, window.location.href);
        url.searchParams.set('_retry', Date.now());
        image.hidden = false;
        fallback.hidden = true;
        image.src = url.href;
      };

      const cardMarkup = card => {
        const row = card.row;
        const name = get(row, 'card_name') || '未命名卡片';
        const setCode = get(row, 'expansion_code');
        const number = get(row, 'collector_number');
        const type = get(row, 'pokemon_type');
        const subtype = get(row, 'subtype');
        const reg = get(row, 'regulation_mark');
        return `
          <article class="card-tile" tabindex="0" role="button" aria-label="查看 ${escapeAttr(name)} 的完整資料" data-position="${card.position}">
            <div class="image-wrap">${imageMarkup(row, 'card-image')}</div>
            <div class="card-body">
              <h2 class="card-title" title="${escapeAttr(name)}">${escapeHtml(name)}</h2>
              <div class="card-number">${escapeHtml([setCode, number].filter(Boolean).join(' · '))}</div>
              <div class="chips">
                ${type ? `<span class="chip">${escapeHtml(type)}</span>` : ''}
                ${subtype ? `<span class="chip">${escapeHtml(subtype)}</span>` : ''}
                ${reg ? `<span class="chip reg">${escapeHtml(reg)}</span>` : ''}
              </div>
            </div>
          </article>`;
      };

      const renderResults = () => {
        const visible = filteredCards.slice(0, visibleCount);
        elements.count.innerHTML = isHomeRandom
          ? `首頁隨機展示 <span>${visible.length.toLocaleString('zh-TW')}</span> 張卡片`
          : `找到 <span>${filteredCards.length.toLocaleString('zh-TW')}</span> 張卡片`;
        if (!visible.length) {
          elements.grid.innerHTML = '<div class="empty-state"><h2>沒有找到符合條件的卡片</h2><p>可以縮短關鍵字，或清除部分篩選條件再試一次。</p></div>';
        } else {
          elements.grid.innerHTML = visible.map(cardMarkup).join('');
        }
        const remaining = filteredCards.length - visible.length;
        elements.loadMore.hidden = isHomeRandom || remaining <= 0;
        elements.loadMore.textContent = remaining > 0 ? `顯示更多（還有 ${remaining.toLocaleString('zh-TW')} 張）` : '顯示更多卡片';
      };

      const selectedValues = filter => new Set(
        [...filter.list.querySelectorAll('input:checked')].map(input => input.value)
      );

      const updateExpansionOptionVisibility = () => {
        const categories = selectedValues(filters.category);
        const query = normalize(elements.expansionOptionSearch.value);
        filters.expansion.list.querySelectorAll('.check-option').forEach(option => {
          option.hidden = (categories.size > 0 && !categories.has(option.dataset.category))
            || (query.length > 0 && !normalize(option.textContent).includes(query));
        });
      };

      const updateFilterLabel = filter => {
        const selected = [...filter.list.querySelectorAll('input:checked')];
        const label = filter.details.querySelector('.multi-value');
        label.textContent = selected.length === 0
          ? filter.allLabel
          : selected.length === 1
            ? selected[0].dataset.label || selected[0].value
            : `已選 ${selected.length} 項`;
        label.classList.toggle('has-selection', selected.length > 0);
        elements.filterCount.textContent = Object.values(filters).reduce(
          (count, current) => count + current.list.querySelectorAll('input:checked').length, 0
        );
      };

      const setFilterDrawer = open => {
        elements.filterFields.classList.toggle('is-open', open);
        elements.filterBackdrop.classList.toggle('is-open', open);
        elements.filterToggle.setAttribute('aria-expanded', String(open));
        document.body.classList.toggle('filters-open', open);
        if (!open) Object.values(filters).forEach(filter => { filter.details.open = false; });
      };

      const setFilterValues = (filter, values) => {
        const selected = new Set(values);
        filter.list.querySelectorAll('input[type="checkbox"]').forEach(input => {
          input.checked = selected.has(input.value);
        });
        updateFilterLabel(filter);
      };

      const clearAllFilters = () => {
        Object.values(filters).forEach(filter => setFilterValues(filter, []));
      };

      const applyFilters = () => {
        const tokens = normalize(elements.search.value).split(' ').filter(Boolean);
        const active = Object.fromEntries(
          Object.entries(filters).map(([key, filter]) => [key, selectedValues(filter)])
        );

        const hasCriteria = tokens.length > 0 || Object.values(active).some(values => values.size > 0);
        if (!hasCriteria) {
          isHomeRandom = true;
          filteredCards = pickRandomCards(cards, HOME_CARD_COUNT);
          visibleCount = HOME_CARD_COUNT;
          renderResults();
          return;
        }

        isHomeRandom = false;
        filteredCards = cards.filter(card => {
          const row = card.row;
          if (active.category.size && !active.category.has(seriesFor(row)?.category)) return false;
          if (active.expansion.size && !active.expansion.has(get(row, 'expansion_code'))) return false;
          if (active.kind.size && !active.kind.has(get(row, 'card_kind'))) return false;
          if (active.type.size && !active.type.has(get(row, 'pokemon_type'))) return false;
          if (active.stage.size && !active.stage.has(get(row, 'evolution_stage'))) return false;
          if (active.regulation.size && !active.regulation.has(get(row, 'regulation_mark'))) return false;
          return tokens.every(token => searchTextFor(card).includes(token));
        }).sort((a, b) => compareSeriesCodes(
          get(a.row, 'expansion_code'), get(b.row, 'expansion_code')
        ) || a.position - b.position);
        visibleCount = PAGE_SIZE;
        renderResults();
      };

      const detailValue = (label, value) => value
        ? `<div class="stat"><small>${escapeHtml(label)}</small><strong>${escapeHtml(value)}</strong></div>`
        : '';

      const statGroup = (className, values) => {
        const content = values.map(([label, value]) => detailValue(label, value)).join('');
        return content ? `<div class="stat-group ${className}">${content}</div>` : '';
      };

      const detailSection = (title, value, extraClass = '') => value
        ? `<section class="detail-section"><h3>${escapeHtml(title)}</h3><p class="${extraClass}">${escapeHtml(value)}</p></section>`
        : '';

      const skillsMarkup = skills => {
        if (!Array.isArray(skills) || !skills.length) return '';
        return `<section class="detail-section"><h3>招式與能力</h3><div class="skill-list">${skills.map(skill => `
          <div class="skill">
            <div class="skill-title"><strong>${escapeHtml(skill.name || skill.section || '招式')}</strong>${skill.damage ? `<span class="damage">${escapeHtml(skill.damage)}</span>` : ''}</div>
            ${skill.section || (skill.cost && skill.cost.length) ? `<div class="skill-meta">${escapeHtml([skill.section, (skill.cost || []).join('、')].filter(Boolean).join(' · '))}</div>` : ''}
            ${skill.effect ? `<p class="skill-effect">${escapeHtml(skill.effect)}</p>` : ''}
          </div>`).join('')}</div></section>`;
      };

      const detailPacks = new Map();
      const loadDetailRow = card => {
        const code = get(card.row, 'expansion_code');
        let request = detailPacks.get(code);
        if (!request) {
          const version = pack.detailVersions[code];
          if (!version) return Promise.reject(new Error(`Missing detail version: ${code}`));
          request = fetch(`series-data/${encodeURIComponent(code)}.json?v=${version}`)
            .then(response => {
              if (!response.ok) throw new Error(`Card detail request failed: ${response.status}`);
              return response.json();
            })
            .then(data => {
              if (data.fields.join('|') !== fields.join('|')) throw new Error('Card detail fields do not match');
              const idIndex = fieldIndex.card_id;
              return new Map(data.rows.map(row => [row[idIndex], row]));
            })
            .catch(error => { detailPacks.delete(code); throw error; });
          detailPacks.set(code, request);
        }
        return request.then(rows => {
          const row = rows.get(get(card.row, 'card_id'));
          if (!row) throw new Error('Card detail is missing');
          return row;
        });
      };
      let detailRequestId = 0;

      const openDetail = async position => {
        const card = cards[position];
        if (!card) return;
        const requestId = ++detailRequestId;
        let row = loadDetailRow(card);
        if (row && typeof row.then === 'function') {
          elements.dialogTitle.textContent = get(card.row, 'card_name') || '卡片資料';
          elements.dialogContent.innerHTML = '<p class="detail-loading" role="status">載入卡片資料中…</p>';
          if (!elements.dialog.open) elements.dialog.showModal();
          try {
            row = await row;
          } catch (error) {
            if (requestId !== detailRequestId || !elements.dialog.open) return;
            elements.dialogContent.innerHTML = `<p class="detail-loading" role="alert">卡片資料載入失敗，請檢查網路後再試。<br><button class="image-retry" type="button" data-retry-detail="${position}">重新載入卡片資料</button></p>`;
            console.error(error);
            return;
          }
          if (requestId !== detailRequestId || !elements.dialog.open) return;
        }
        const name = get(row, 'card_name') || '卡片資料';
        const kind = get(row, 'card_kind');
        const type = get(row, 'pokemon_type');
        const typeIcon = pack.typeIcons?.[type];
        const setLine = [seriesFor(row)?.label || get(row, 'expansion_name'), get(row, 'collector_number')].filter(Boolean).join(' · ');
        const official = get(row, 'detail_url');
        const qa = get(row, 'qa_url');

        elements.dialogTitle.innerHTML = `${kind ? `<span class="modal-kind">${escapeHtml(kind)}</span>` : ''}<span class="modal-name">${escapeHtml(name)}</span>${typeIcon ? `<img class="modal-type-icon" src="${escapeAttr(typeIcon)}" alt="${escapeAttr(type)}屬性">` : ''}`;
        elements.dialogContent.innerHTML = `
          <div class="modal-grid">
            <div class="detail-image-wrap">${imageMarkup(row, 'detail-image', '卡圖')}</div>
            <div class="detail-side">
              <p class="set-line">${escapeHtml(setLine)}</p>
              <div class="stat-groups">
                ${statGroup('', [['規則標記', get(row, 'regulation_mark')]])}
                ${statGroup('stat-group-two', [['分類', get(row, 'subtype')], ['進化階段', get(row, 'evolution_stage')]])}
                ${statGroup('stat-group-four', [['HP', get(row, 'hp')], ['弱點', get(row, 'weakness')], ['抵抗力', get(row, 'resistance')], ['撤退費用', get(row, 'retreat_cost')]])}
                ${statGroup('stat-group-two', [['稀有度', get(row, 'rarity')], ['繪師', get(row, 'illustrator')]])}
              </div>
              ${skillsMarkup(get(row, 'skills_json'))}
              ${detailSection('圖鑑資訊', get(row, 'pokedex_info'))}
              ${detailSection('身高與體重', get(row, 'size_info'))}
              ${detailSection('卡片敘述', get(row, 'flavor_text'), 'flavor')}
              <div class="link-row">
                ${official ? `<a class="official-link" href="${escapeAttr(official)}" target="_blank" rel="noopener noreferrer">查看官方卡片頁</a>` : ''}
                ${qa ? `<a class="official-link secondary" href="${escapeAttr(qa)}" target="_blank" rel="noopener noreferrer">查看官方 Q&amp;A</a>` : ''}
              </div>
            </div>
          </div>`;

        if (!elements.dialog.open) elements.dialog.showModal();
      };

      elements.search.addEventListener('input', () => {
        window.clearTimeout(searchTimer);
        searchTimer = window.setTimeout(applyFilters, 160);
      });

      elements.expansionOptionSearch.addEventListener('input', () => {
        updateExpansionOptionVisibility();
      });

      elements.filterToggle.addEventListener('click', () => setFilterDrawer(true));
      elements.filterClose.addEventListener('click', () => setFilterDrawer(false));
      elements.filterBackdrop.addEventListener('click', () => setFilterDrawer(false));

      Object.values(filters).forEach(filter => {
        filter.list.addEventListener('change', event => {
          if (!event.target.matches('input[type="checkbox"]')) return;
          if (filter === filters.category) {
            const selectedCategories = selectedValues(filters.category);
            filters.expansion.list.querySelectorAll('.check-option').forEach(option => {
              if (selectedCategories.size && !selectedCategories.has(option.dataset.category)) {
                option.querySelector('input').checked = false;
              }
            });
            updateFilterLabel(filters.expansion);
            updateExpansionOptionVisibility();
          }
          updateFilterLabel(filter);
          applyFilters();
        });
        filter.details.querySelector('.multi-actions').addEventListener('click', event => {
          const button = event.target.closest('button[data-action]');
          if (!button) return;
          const checked = button.dataset.action === 'all';
          filter.list.querySelectorAll('input[type="checkbox"]').forEach(input => {
            if (!checked || filter !== filters.expansion || !input.closest('.check-option').hidden) input.checked = checked;
          });
          if (filter === filters.category) {
            updateExpansionOptionVisibility();
          }
          updateFilterLabel(filter);
          applyFilters();
        });
        filter.details.addEventListener('toggle', () => {
          if (!filter.details.open) return;
          Object.values(filters).forEach(other => {
            if (other !== filter) other.details.open = false;
          });
        });
      });

      document.addEventListener('click', event => {
        if (event.target.closest('.multi-select')) return;
        Object.values(filters).forEach(filter => { filter.details.open = false; });
      });

      document.addEventListener('keydown', event => {
        if (event.key !== 'Escape') return;
        setFilterDrawer(false);
        Object.values(filters).forEach(filter => { filter.details.open = false; });
      });

      elements.clear.addEventListener('click', () => {
        elements.search.value = '';
        elements.expansionOptionSearch.value = '';
        clearAllFilters();
        updateExpansionOptionVisibility();
        applyFilters();
        elements.search.focus();
      });
      elements.loadMore.addEventListener('click', () => {
        visibleCount += PAGE_SIZE;
        renderResults();
      });
      elements.grid.addEventListener('click', event => {
        const retry = event.target.closest('[data-src]');
        if (retry) { retryImage(retry); return; }
        const tile = event.target.closest('.card-tile');
        if (tile) openDetail(Number(tile.dataset.position));
      });
      elements.grid.addEventListener('keydown', event => {
        if (event.key !== 'Enter' && event.key !== ' ') return;
        const tile = event.target.closest('.card-tile');
        if (!tile) return;
        event.preventDefault();
        openDetail(Number(tile.dataset.position));
      });
      elements.closeDialog.addEventListener('click', () => elements.dialog.close());
      elements.dialog.addEventListener('click', event => {
        const retryImageButton = event.target.closest('[data-src]');
        if (retryImageButton) { retryImage(retryImageButton); return; }
        const retryDetailButton = event.target.closest('[data-retry-detail]');
        if (retryDetailButton) { openDetail(Number(retryDetailButton.dataset.retryDetail)); return; }
        if (event.target === elements.dialog) elements.dialog.close();
      });

      const registerWebMcp = () => {
        const context = document.modelContext;
        if (!context?.registerTool) return;
        const allowed = Object.fromEntries(Object.entries(filters).map(([key, filter]) => [
          key,
          new Set([...filter.list.querySelectorAll('input[type="checkbox"]')].map(input => input.value)),
        ]));
        const tool = {
          name: 'search_cards',
          title: '搜尋 PTCG 卡片',
          description: '以關鍵字及可複選的系列分類、系列、卡片種類、屬性、進化階段或規則標記，搜尋本頁內建的繁體中文版 PTCG 卡片。',
          inputSchema: {
            type: 'object',
            properties: {
              query: { type: 'string' },
              category: { type: 'array', items: { type: 'string' }, uniqueItems: true },
              expansion: { type: 'array', items: { type: 'string' }, uniqueItems: true },
              kind: { type: 'array', items: { type: 'string' }, uniqueItems: true },
              type: { type: 'array', items: { type: 'string' }, uniqueItems: true },
              stage: { type: 'array', items: { type: 'string' }, uniqueItems: true },
              regulation: { type: 'array', items: { type: 'string' }, uniqueItems: true },
            },
            additionalProperties: false,
          },
          annotations: { readOnlyHint: true, untrustedContentHint: false },
          execute(input) {
            if (!input || typeof input !== 'object' || Array.isArray(input)) throw new Error('搜尋條件格式不正確');
            if (input.query !== undefined && typeof input.query !== 'string') throw new Error('query 必須是文字');
            for (const key of ['category', 'expansion', 'kind', 'type', 'stage', 'regulation']) {
              if (input[key] === undefined) continue;
              if (!Array.isArray(input[key])) throw new Error(`${key} 必須是文字陣列`);
              if (input[key].some(value => typeof value !== 'string' || !allowed[key].has(value))) {
                throw new Error(`${key} 包含不可用的篩選值`);
              }
            }
            elements.search.value = input.query ?? '';
            Object.entries(filters).forEach(([key, filter]) => setFilterValues(filter, input[key] ?? []));
            updateExpansionOptionVisibility();
            applyFilters();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            return {
              count: filteredCards.length,
              cards: filteredCards.slice(0, 20).map(card => ({
                id: get(card.row, 'card_id'),
                name: get(card.row, 'card_name'),
                number: get(card.row, 'collector_number'),
                expansion: seriesFor(card.row)?.label || get(card.row, 'expansion_name'),
              })),
            };
          },
        };
        try { Promise.resolve(context.registerTool(tool)).catch(() => {}); } catch (_) {}
      };

      if (elements.search.value.trim()) applyFilters();
      else renderResults();
      registerWebMcp();
    })().catch(error => {
      const message = '卡片資料載入失敗，請確認網路後重新整理。';
      document.getElementById('dataset-note').textContent = message;
      document.getElementById('load-progress').hidden = true;
      const retry = document.getElementById('retry-load');
      retry.hidden = false;
      retry.onclick = () => window.location.reload();
      document.querySelector('main').removeAttribute('aria-busy');
      console.error(error);
    });
  </script>
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      navigator.serviceWorker.register('sw.js').then(registration => {
        const warm = () => registration.active?.postMessage({ type: 'warm-index', url: 'cards-index.json?v=6541cec68f6d' });
        if ('requestIdleCallback' in window) requestIdleCallback(warm); else setTimeout(warm, 1200);
      }).catch(() => {});
    }
  </script>
</body>
</html>
